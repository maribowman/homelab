services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - timescaledb-data:/home/postgres/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin
      interval: 60s
      timeout: 5s
      retries: 5

networks: {}

volumes:
  timescaledb-data:
