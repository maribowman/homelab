services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    restart: unless-stopped
    ports:
      # Bound to all interfaces on purpose: Home Assistant (192.168.0.2) connects
      # over the LAN. Accepted exposure for a trusted LAN-only homelab. See TODO.md #5.
      - 5432:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - timescaledb-data:/home/postgres/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin
      interval: 60s
      timeout: 5s
      retries: 5

networks: {}

volumes:
  timescaledb-data:
