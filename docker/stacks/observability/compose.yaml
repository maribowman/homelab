services:
  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in docker/stacks/observability/.env}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Strava datasource, for a planned Strava dashboard (not used yet)
      - GF_SERVER_ROOT_URL=http://10.0.40.40:3000
      - GF_PLUGINS_PREINSTALL=grafana-strava-datasource
      - GF_FEATURE_TOGGLES_ENABLE=externalServiceAccounts,datasourceLegacyIdApi
      - GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    restart: unless-stopped
    ports:
      # Bound to all interfaces on purpose, with the remote-write receiver enabled
      # below. Accepted exposure for a trusted LAN-only homelab.
      - 9090:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      # Explicit retention (default is 15d). Aligned with Loki's 30d window.
      # Add --storage.tsdb.retention.size=<N>GB once the disk budget is known.
      - --storage.tsdb.retention.time=30d
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.16.2@sha256:32913cbfac652d15fa84d256a74e5ee3f71575961bb19d34796ce3838bfba693
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    ports:
      - 12345:12345
    volumes:
      - ./main.alloy:/etc/alloy/main.alloy:ro
      - ./modules:/etc/alloy/modules:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/main.alloy
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - observability

  # Lightweight per-container metrics exporter (CPU, memory, disk I/O, network),
  # scraped by Alloy on :9333. Replaces cAdvisor, which used ~10x the RAM and
  # ~15-20x the CPU. Trade-off: no per-container disk *usage* (filesystem size),
  # which is essentially a cAdvisor-only metric.
  logporter:
    image: lifailon/logporter:1.4.1@sha256:522a4f917a1e21d8d8790ca4d55f7909c7620acb77e76a71bcb2f6dc5681a053
    container_name: logporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
