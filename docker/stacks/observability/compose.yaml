services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in docker/stacks/observability/.env}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    restart: unless-stopped
    ports:
      # Bound to all interfaces on purpose, with the remote-write receiver enabled
      # below. Accepted exposure for a trusted LAN-only homelab. See TODO.md #5.
      - 9090:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      # Explicit retention (default is 15d). Aligned with Loki's 30d window.
      # Add --storage.tsdb.retention.size=<N>GB once the disk budget is known.
      - --storage.tsdb.retention.time=30d
    networks:
      - observability

  loki:
    image: grafana/loki:3
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.16.2
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    ports:
      - 12345:12345
    volumes:
      - ./main.alloy:/etc/alloy/main.alloy:ro
      - ./modules:/etc/alloy/modules:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/main.alloy
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - observability

  # Lightweight per-container metrics exporter (CPU, memory, disk I/O, network),
  # scraped by Alloy on :9333. Replaces cAdvisor, which used ~10x the RAM and
  # ~15-20x the CPU. Trade-off: no per-container disk *usage* (filesystem size),
  # which is essentially a cAdvisor-only metric.
  # Upstream only publishes the `latest` tag, so it can't be pinned like the rest.
  logporter:
    image: lifailon/logporter:latest
    container_name: logporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
