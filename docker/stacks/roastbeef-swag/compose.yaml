services:
  roastbeef-swag:
    # TODO: pin to latest@sha256:<digest>; ghcr requires auth for this package, so the digest could not be read
    image: ghcr.io/maribowman/roastbeef-swag:latest
    container_name: roastbeef-swag
    restart: always
    ports:
      - 8800:8800
    volumes:
      # TODO: Fix write permissions on VM
      - ./data:/data
    command: prod
networks: {}
