---
# Prune unused TrueNAS app images on its own -> one Discord summary.
# Keeps the images in use plus one rollback image per repository; see roles/prune_truenas_images.
# The weekly run prunes too (include/truenas_update.yaml), so this is for manual runs.

- name: Prune TrueNAS app images
  hosts: truenas_hosts
  gather_facts: false
  become: false

  roles:
    - role: prune_truenas_images

- name: Run summary
  ansible.builtin.import_playbook: include/run_summary.yaml
  vars:
    run_report_title: TrueNAS prune
