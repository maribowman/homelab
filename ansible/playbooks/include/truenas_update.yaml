---
# TrueNAS app updates (imported by truenas.yaml and maintenance.yaml, followed by
# include/run_summary.yaml): prune unused app images -> free-space guard -> every non-major
# catalog app upgrade, image pulls for custom apps, majors and OS updates recorded as todos
# (only when the guard passed). Images the upgrades make obsolete are pruned by next week's run.
# See roles/prune_truenas_images and roles/update_truenas_apps.
# prune_truenas_images_enabled: false skips the prune and the guard.
#
# Independent of the Proxmox part: TrueNAS is not in guests, so a failed guest update
# does not skip it. Nothing is sent from here; results are recorded with run_report.

- name: Update TrueNAS apps
  hosts: truenas_hosts
  gather_facts: false
  become: false

  tasks:
    - name: Update TrueNAS apps
      block:
        # frees space for the pulls that follow
        - name: Prune app images
          ansible.builtin.include_role:
            name: prune_truenas_images
          when: prune_truenas_images_enabled | default(true) | bool

        - name: Check free space on the apps pool
          ansible.builtin.include_role:
            name: prune_truenas_images
            tasks_from: guard
          when: prune_truenas_images_enabled | default(true) | bool

        - name: Upgrade apps
          ansible.builtin.include_role:
            name: update_truenas_apps
          when: prune_truenas_images_space_ok | default(true) | bool
      rescue:
        # update_truenas_apps records per-app failures itself; anything else (e.g. the app query) is recorded here
        - name: Report failure
          ansible.builtin.include_role:
            name: run_report
            tasks_from: record
          vars:
            report_level: error
            report_text: >-
              '{{ ansible_failed_task.name | default('unknown') }}' failed:
              {{ ansible_failed_result.msg | default('unknown error') }}
            report_todo: "check the run log and re-run task ansible:truenas:update"
          # a failed app query is already recorded by the role
          when: ansible_failed_task.name | default('') != 'Fail on failed app query'
