---
- name: System maintenance — guests
  hosts: all:!pve_hosts
  become: true

  roles:
    - role: snapshot_proxmox_machines
    - role: deploy_docker_stacks
      vars:
        docker_state: "down"
      when: inventory_hostname in groups['docker_hosts']
    - role: update_proxmox_machines
    - role: deploy_docker_stacks
      vars:
        docker_state: "up"
      when: inventory_hostname in groups['docker_hosts']

# The hypervisor is patched and rebooted LAST: it has no vmid (cannot snapshot
# itself) and rebooting it takes down every guest, so it must run after the
# guests are updated and back up.
- name: System maintenance — Proxmox hypervisor
  hosts: pve_hosts
  become: true

  roles:
    - role: update_proxmox_machines
