---
# Weekly maintenance run: preflight backup check -> guests one at a time (PBS last) ->
# PVE host -> one Discord summary for the whole run (also under --limit).
# See include/proxmox_update.yaml for the update flow and include/run_summary.yaml for the summary.

- name: Proxmox updates
  ansible.builtin.import_playbook: include/proxmox_update.yaml

- name: Run summary
  ansible.builtin.import_playbook: include/run_summary.yaml
  vars:
    run_report_title: Maintenance
