version: "3"

tasks:
  provision:
    desc: "Create and start the control LXC on Proxmox"
    silent: true
    deps: [":init"]
    cmd: |
      "{{.VENV}}/bin/ansible-playbook" "{{.PLAYBOOK}}" \
      --vault-password-file "{{.VAULT_PWD_FILE}}" \
      --tags provision {{.CLI_ARGS}}

  apply:
    desc: "Configure the control LXC (SSH access, repo, vault, systemd timers)"
    silent: true
    deps: [":init"]
    cmd: |
      "{{.VENV}}/bin/ansible-playbook" "{{.PLAYBOOK}}" \
      --vault-password-file "{{.VAULT_PWD_FILE}}" \
      --tags apply {{.CLI_ARGS}}
