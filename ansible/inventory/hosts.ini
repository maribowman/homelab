[ubuntu_nodes]
vm-docker       ansible_host=10.0.40.40   vmid=101

[debian_nodes]
lxc-tailscale   ansible_host=10.0.40.90  vmid=1000
# PBS LXC. Add `vmid=<id>` (run `pct list` on the PVE host) to enable pre-update snapshots.
lxc-pbs         ansible_host=192.168.0.101

[pve_hosts]
# The Proxmox hypervisor itself: it has no vmid and cannot snapshot itself, so it
# is patched and rebooted LAST (see playbooks/proxmox.yaml), and never snapshotted.
pve             ansible_host=10.0.10.10

[docker_hosts]
vm-docker

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519
