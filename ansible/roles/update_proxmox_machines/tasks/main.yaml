---
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
  register: update_proxmox_machines_apt

- name: Count upgraded packages
  ansible.builtin.set_fact:
    update_proxmox_machines_packages: >-
      {{ update_proxmox_machines_apt.stdout | default('')
         | regex_findall('(\d+) upgraded, (\d+) newly installed')
         | first | default(['0', '0']) | map('int') | sum }}

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: update_proxmox_machines_reboot_flag

- name: Reboot if required
  ansible.builtin.reboot:
    msg: "Rebooting after update"
    reboot_timeout: "{{ update_proxmox_machines_reboot_timeout }}"
  when: update_proxmox_machines_reboot_flag.stat.exists
  register: update_proxmox_machines_reboot

- name: Record reboot
  ansible.builtin.set_fact:
    update_proxmox_machines_rebooted: "{{ update_proxmox_machines_reboot is changed }}"
