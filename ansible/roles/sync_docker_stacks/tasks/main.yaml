---
- name: Push local stacks to remote
  ansible.posix.synchronize:
    src: "{{ local_stacks_path }}/"
    dest: "{{ dockge_stacks_path }}/"
    recursive: true
    rsync_opts:
      - "--exclude=data"
      # .env files are written from the vault below; .env.example and other .env* files are never synced
      - "--exclude=.env*"

# Only stacks listed in docker_stack_env are managed; any other .env is left alone
- name: Validate docker_stack_env
  ansible.builtin.assert:
    that: (docker_stack_env | default({})).values() | reject('mapping') | list | length == 0
    fail_msg: >-
      docker_stack_env must map each stack to a dict of KEY: value (check the indentation in the vault),
      offending stacks: {{ (docker_stack_env | default({})) | dict2items | rejectattr('value', 'mapping') | map(attribute='key') | list }}
    quiet: true

- name: Write stack .env files from the vault
  ansible.builtin.template:
    src: stack.env.j2
    dest: "{{ dockge_stacks_path }}/{{ item.key }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ docker_stack_env | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  diff: false

- name: Pull remote-only stacks to local git
  ansible.posix.synchronize:
    src: "{{ dockge_stacks_path }}/"
    dest: "{{ local_stacks_path }}/"
    recursive: true
    mode: pull
    rsync_opts:
      - "--exclude=dockge"
      - "--exclude=data"
      - "--exclude=.env*"
  when: sync_pull_remote | bool
