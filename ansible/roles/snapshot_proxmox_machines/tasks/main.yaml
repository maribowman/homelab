---
- name: Create machine snapshot
  community.proxmox.proxmox_snap:
    api_host: "{{ pve_host }}"
    api_user: "{{ pve_user }}"
    api_token_id: "{{ pve_token_id }}"
    api_token_secret: "{{ pve_token_secret }}"
    vmid: "{{ vmid }}"
    state: present
    snapname: "pre_update_{{ ansible_facts['date_time']['date'] }}"
    retention: "{{ snapshot_retention }}"
  delegate_to: localhost
  become: false
  # The PVE host has no vmid (it cannot snapshot itself); guests without a vmid
  # set in inventory are skipped rather than failing the run.
  when: vmid is defined
