---
- name: Deploy docker stacks
  block:
    - name: Validate docker_state
      ansible.builtin.assert:
        that: docker_state in ['up', 'down', 'restart', 'pull', 'health']
        fail_msg: "docker_state must be one of up | down | restart | pull | health, got '{{ docker_state }}'"
        quiet: true

    - name: Find all docker stack compose files
      ansible.builtin.find:
        paths: "{{ dockge_stacks_path }}"
        patterns:
          - "docker-compose.yaml"
          - "docker-compose.yml"
          - "compose.yaml"
          - "compose.yml"
        file_type: file
        recurse: true
        depth: 2
      register: deploy_docker_stacks_compose_files

    - name: Select target docker stacks
      ansible.builtin.set_fact:
        deploy_docker_stacks_dirs: >-
          {{ deploy_docker_stacks_compose_files.files | map(attribute='path') | map('dirname') | unique
             | reject('match', '.*/dockge$')
             | select('match', '.*/' ~ (target_stack | regex_escape if target_stack else '[^/]+') ~ '$')
             | list }}

    - name: Validate target_stack
      ansible.builtin.assert:
        that: deploy_docker_stacks_dirs | length > 0
        fail_msg: "No docker stack found for target_stack='{{ target_stack }}' under {{ dockge_stacks_path }}"
        quiet: true

    - name: Run docker compose {{ docker_state }}
      vars:
        deploy_docker_stacks_args:
          up: [up, -d]
          down: [down]
          restart: [restart]
          pull: [up, -d, --pull, always, --remove-orphans]
      ansible.builtin.command:
        argv: "{{ ['docker', 'compose'] + deploy_docker_stacks_args[docker_state] }}"
      args:
        chdir: "{{ item }}"
      loop: "{{ deploy_docker_stacks_dirs }}"
      loop_control:
        label: "{{ item | basename }}"
      register: deploy_docker_stacks_compose
      changed_when: >-
        (deploy_docker_stacks_compose.stdout ~ deploy_docker_stacks_compose.stderr)
        is search('(Created|Recreated|Started|Restarted|Stopped|Removed)')
      when: docker_state != 'health'

    - name: Wait for docker stack containers to be running and healthy
      vars:
        # `docker compose ps --format json` prints one object per line (compose >= 2.21) or a single array (older)
        deploy_docker_stacks_containers: >-
          {{ deploy_docker_stacks_health.stdout | from_json
             if (deploy_docker_stacks_health.stdout | trim).startswith('[')
             else deploy_docker_stacks_health.stdout_lines | select('match', '^ *[{]') | map('from_json') | list }}
        deploy_docker_stacks_not_running: "{{ deploy_docker_stacks_containers | rejectattr('State', 'eq', 'running') | list }}"
        deploy_docker_stacks_not_healthy: >-
          {{ deploy_docker_stacks_containers | selectattr('Health', 'defined')
             | selectattr('Health', 'in', ['starting', 'unhealthy']) | list }}
      ansible.builtin.command:
        cmd: docker compose ps --all --format json
        chdir: "{{ item }}"
      loop: "{{ deploy_docker_stacks_dirs }}"
      loop_control:
        label: "{{ item | basename }}"
      register: deploy_docker_stacks_health
      changed_when: false
      check_mode: false
      until: >-
        deploy_docker_stacks_health.rc == 0
        and deploy_docker_stacks_containers | length > 0
        and deploy_docker_stacks_not_running | length == 0
        and deploy_docker_stacks_not_healthy | length == 0
      retries: "{{ deploy_docker_stacks_health_retries }}"
      delay: "{{ deploy_docker_stacks_health_delay }}"
      # pull also health-checks, so a deploy only succeeds once the new containers are up
      when: docker_state in ['pull', 'health']

    - name: Report deployed docker stacks
      ansible.builtin.include_role:
        name: run_report
        tasks_from: record
      vars:
        # pull: the stacks whose containers compose created or recreated (new image or config); shown as sub-bullets
        deploy_docker_stacks_updated: >-
          {{ deploy_docker_stacks_compose.results | default([]) | selectattr('changed', 'defined') | selectattr('changed')
             | map(attribute='item') | map('basename') | list }}
        report_level: ok
        report_text: >-
          {{ 'restarted:' if docker_state == 'restart'
             else ('deployed ' ~ deploy_docker_stacks_dirs | length ~ ' stacks, '
                   ~ (('updated:' if deploy_docker_stacks_updated else 'none changed')
                      if not ansible_check_mode else 'changes unknown in check mode')) }}
        report_items: >-
          {{ deploy_docker_stacks_dirs | map('basename') | list if docker_state == 'restart'
             else (deploy_docker_stacks_updated if not ansible_check_mode else []) }}
      # up/down/health are steps of the proxmox update, which reports the guest as a whole
      when: docker_state in ['pull', 'restart']

  rescue:
    - name: Collect failed docker stacks
      ansible.builtin.set_fact:
        deploy_docker_stacks_failed: >-
          {{ ((deploy_docker_stacks_compose.results | default([])) + (deploy_docker_stacks_health.results | default([])))
             | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='item') | map('basename') | unique | list }}
        deploy_docker_stacks_error: "{{ ansible_failed_result.msg | default('unknown error') }}"

    - name: Report failed docker stacks
      ansible.builtin.include_role:
        name: run_report
        tasks_from: record
      vars:
        report_level: error
        report_text: >-
          docker {{ docker_state }} failed: {{ ('stacks ' ~ (deploy_docker_stacks_failed | join(', ')))
          if deploy_docker_stacks_failed | length > 0 else deploy_docker_stacks_error }}
        report_todo: >-
          check {{ ('stacks ' ~ (deploy_docker_stacks_failed | join(', '))) if deploy_docker_stacks_failed | length > 0
          else 'the docker stacks' }} on {{ inventory_hostname }} (docker compose ps / logs)

    # The caller decides what a failure means (proxmox_update rolls back, docker.yaml reports)
    - name: Fail on failed docker stacks
      ansible.builtin.fail:
        msg: >-
          docker_state={{ docker_state }} failed on {{ inventory_hostname }}:
          {{ deploy_docker_stacks_failed | join(', ') if deploy_docker_stacks_failed | length > 0 else deploy_docker_stacks_error }}
