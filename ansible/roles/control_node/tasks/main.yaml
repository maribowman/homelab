---
# Configures the control LXC: tooling, repo clone, vault, self-updates, systemd timers.
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ control_node_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone (timers use local time)
  community.general.timezone:
    name: "{{ control_node_timezone }}"

- name: Install go-task from GitHub release
  ansible.builtin.apt:
    deb: "{{ control_node_task_deb_url }}"
    state: present

# --- GitHub deploy key -------------------------------------------------------
- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate GitHub deploy key
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -q -t ed25519 -N ""
      -C "homelab-deploy@{{ inventory_hostname }}"
      -f {{ control_node_deploy_key_path }}
    creates: "{{ control_node_deploy_key_path }}"
  register: _control_node_deploy_key

- name: Read deploy public key
  ansible.builtin.slurp:
    src: "{{ control_node_deploy_key_path }}.pub"
  register: _control_node_deploy_pubkey

# Not a handler: the clone below needs the key, handlers would only run at the end of the play
- name: Wait for the deploy key to be added to GitHub # noqa: no-handler
  ansible.builtin.pause:
    prompt: |-
      Add this key as a READ-ONLY deploy key to the GitHub repo
      ({{ repo_url }} -> Settings -> Deploy keys), then press Enter:

      {{ _control_node_deploy_pubkey.content | b64decode | trim }}
  when: _control_node_deploy_key is changed

- name: Pin GitHub host key
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: github.com
    key: "{{ control_node_github_known_host }}"
    state: present

# --- Repository + vault ------------------------------------------------------
- name: Clone homelab repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ control_repo_path }}"
    version: "{{ control_node_repo_version }}"
    key_file: "{{ control_node_deploy_key_path }}"
    update: false # timers own `git pull`; apply only clones

- name: Use deploy key for git operations in the clone
  community.general.git_config:
    scope: local
    repo: "{{ control_repo_path }}"
    name: core.sshCommand
    value: "ssh -i {{ control_node_deploy_key_path }} -o IdentitiesOnly=yes"

- name: Copy vault files from the laptop
  ansible.builtin.copy:
    src: "{{ control_node_vault_src_dir }}/{{ item }}"
    dest: "{{ control_repo_path }}/ansible/inventory/group_vars/all/{{ item }}"
    owner: root
    group: root
    mode: "0600"
    decrypt: false # keep vault.yaml encrypted on disk
  loop: "{{ control_node_vault_files }}"
  diff: false

# --- unattended-upgrades for the control node itself -------------------------
- name: Enable periodic unattended-upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades auto-reboot
  ansible.builtin.template:
    src: 52homelab-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# --- systemd schedulers ------------------------------------------------------
- name: Create homelab config and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ control_node_config_dir }}"
    - "{{ control_node_state_dir }}"

- name: Write Discord webhook env file
  ansible.builtin.template:
    src: notify.env.j2
    dest: "{{ control_node_config_dir }}/notify.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install helper scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - homelab-deploy
    - homelab-notify

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ control_node_units }}"
  notify: Reload systemd

- name: Flush handlers before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable and start timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ control_node_timers }}"
