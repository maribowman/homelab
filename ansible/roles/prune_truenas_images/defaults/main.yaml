---
# Prune unused app images (tasks/main.yaml); false skips the prune (the guard is skipped by the caller)
prune_truenas_images_enabled: true
# Regexes matched against an image repository (e.g. "^ghcr.io/immich-app/"); matching repositories keep every image
prune_truenas_images_keep: []
# false: add this pass's counts to the host fact prune_truenas_images_totals and record nothing;
# true: record the totals plus this pass and reset the fact
prune_truenas_images_report: true
# Path on the apps pool whose free space the guard (tasks/guard.yaml) checks
prune_truenas_images_docker_path: /mnt/.ix-apps
# The guard fails (no upgrades or pulls) below either threshold
prune_truenas_images_min_free_gb: 20
prune_truenas_images_min_free_pct: 10
# How midclt is invoked; a string is split on whitespace, a list is used as is
prune_truenas_images_midclt: "{{ update_truenas_apps_midclt | default('midclt') }}"
