---
# Prune unused app images (tasks/main.yaml); false skips the prune (the guard is skipped by the caller)
prune_truenas_images_enabled: true
# Record the "pruned N images, freed X GB" line; the update run turns it off (warnings and the guard still report)
prune_truenas_images_report_ok: true
# Regexes matched against an image repository (e.g. "^ghcr.io/immich-app/"); matching repositories keep every image
prune_truenas_images_keep: []
# Per repository, older images kept for a rollback next to the ones in use; a repository with nothing running
# (stopped app, upgrade that left the app down) keeps this many of its newest images
prune_truenas_images_rollback_count: 2
# Path on the apps pool whose free space the guard (tasks/guard.yaml) checks
prune_truenas_images_docker_path: /mnt/.ix-apps/docker
# zfs binary (the pool's fill level); /usr/sbin is not in a non-root user's PATH
prune_truenas_images_zfs: /usr/sbin/zfs
# The guard fails (no upgrades or pulls) below either threshold: GB free on the docker dataset, % free of its pool
prune_truenas_images_min_free_gb: 20
prune_truenas_images_min_free_pct: 10
# How midclt is invoked; a string is split on whitespace, a list is used as is
prune_truenas_images_midclt: "{{ update_truenas_apps_midclt | default('midclt') }}"
