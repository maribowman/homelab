---
# Free-space guard for the apps pool: run before upgrades so an image pull can't run the pool full and leave a
# half-pulled layer behind. Measures in check mode too.
#
# Sets the host facts prune_truenas_images_space_ok (bool) and prune_truenas_images_free (tasks/measure.yaml) and
# records an error when the free space is below prune_truenas_images_min_free_gb (on the docker dataset) or
# prune_truenas_images_min_free_pct (of the pool), or when it can't be measured.

- name: Measure free space on the apps pool
  ansible.builtin.include_tasks: measure.yaml

- name: Evaluate free space
  ansible.builtin.set_fact:
    prune_truenas_images_space_ok: >-
      {{ prune_truenas_images_free | length > 0
         and prune_truenas_images_free.avail_bytes >= prune_truenas_images_min_free_gb | float * 1000000000
         and prune_truenas_images_free.pct >= prune_truenas_images_min_free_pct | float }}

- name: Report failed free-space check
  ansible.builtin.include_role:
    name: run_report
    tasks_from: record
  vars:
    report_level: error
    report_text: >-
      could not measure free space on {{ prune_truenas_images_docker_path }}:
      {{ prune_truenas_images_measure_error }}; no apps were upgraded
    report_todo: >-
      check that 'df {{ prune_truenas_images_docker_path }}' and '{{ prune_truenas_images_zfs }} list' work for the
      ansible user, then task ansible:truenas:update
  when: prune_truenas_images_free | length == 0

- name: Report low free space
  ansible.builtin.include_role:
    name: run_report
    tasks_from: record
  vars:
    report_level: error
    report_text: >-
      apps pool {{ prune_truenas_images_free.pool }} low on free space:
      {{ '%.1f' | format(prune_truenas_images_free.avail_bytes / 1000000000) }} GB
      ({{ prune_truenas_images_free.pct | round | int }} %) free, need {{ prune_truenas_images_min_free_gb }} GB
      and {{ prune_truenas_images_min_free_pct }} %; no apps were upgraded
    report_todo: "free space on the apps pool, then task ansible:truenas:update"
  when: prune_truenas_images_free | length > 0 and not prune_truenas_images_space_ok
