version: "3"

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel
  VENV: "{{.REPO_ROOT}}/ansible/.venv"
  VAULT_PWD_FILE: "{{.REPO_ROOT}}/ansible/inventory/group_vars/all/.vault.pass"

includes:
  proxmox:
    taskfile: ./taskfiles/proxmox.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/proxmox.yaml"
  truenas:
    taskfile: ./taskfiles/truenas.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/truenas.yaml"
  maintenance:
    taskfile: ./taskfiles/maintenance.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/maintenance.yaml"
  docker:
    taskfile: ./taskfiles/docker.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/docker.yaml"
  backup:
    taskfile: ./taskfiles/backup.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/backup.yaml"
  control:
    taskfile: ./taskfiles/control.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
      PLAYBOOK: "{{.REPO_ROOT}}/ansible/playbooks/control.yaml"

tasks:
  init:
    desc: "Install all required dependencies to run the playbooks"
    silent: true
    sources:
      - "{{.REPO_ROOT}}/ansible/requirements.txt"
      - "{{.REPO_ROOT}}/ansible/requirements.yaml"
    generates:
      - "{{.VENV}}/last-updated" # dummy to save last-updated timestamp
    cmds:
      - python3 -m venv "{{.VENV}}"
      - "{{.VENV}}/bin/pip install -r {{.REPO_ROOT}}/ansible/requirements.txt"
      - "{{.VENV}}/bin/ansible-galaxy collection install -r {{.REPO_ROOT}}/ansible/requirements.yaml"
      - touch "{{.VENV}}/last-updated"

  syntax:
    desc: "Syntax-check every playbook in ansible/playbooks"
    silent: true
    deps: [init]
    dir: "{{.TASKFILE_DIR}}"
    cmd: |
      set -e
      for pb in playbooks/*.yaml; do
        echo "$pb"
        "{{.VENV}}/bin/ansible-playbook" "$pb" --syntax-check {{.CLI_ARGS}}
      done
