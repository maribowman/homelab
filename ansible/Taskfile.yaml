version: "3"

vars:
  VENV: "{{.ROOT_DIR}}/.venv"
  VAULT_PWD_FILE: "{{.ROOT_DIR}}/inventory/group_vars/all/.vault.pass"

includes:
  proxmox:
    taskfile: ./taskfiles/proxmox.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"
  docker:
    taskfile: ./taskfiles/docker.yaml
    vars:
      VENV: "{{.VENV}}"
      VAULT_PWD_FILE: "{{.VAULT_PWD_FILE}}"

tasks:
  init:
    desc: "Install all required dependencies to run the playbooks"
    silent: true
    sources:
      - "{{.ROOT_DIR}}/requirements.txt"
      - "{{.ROOT_DIR}}/requirements.yaml"
    generates:
      - "{{.VENV}}/last-updated" # dummy to save last-updated timestamp
    cmds:
      - python3 -m venv "{{.VENV}}"
      - "{{.VENV}}/bin/pip install -r requirements.txt"
      - "{{.VENV}}/bin/ansible-galaxy collection install -r requirements.yaml"
      - touch "{{.VENV}}/last-updated"
